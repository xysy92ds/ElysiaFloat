<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>爱莉希雅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  background:transparent;user-select:none}
:root{--c1:#ff9a9e;--c2:#fecfef;--bg:rgba(255,240,245,.97);
  --card:#fff0f5;--text:#4a2c3a;--muted:#a87b8e;--accent:#d6336c}
#app{width:100%;height:100%;background:var(--bg);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);border-radius:20px;position:absolute;top:0;left:0;
  transform-origin:top left;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(255,182,193,.35);
  border:1px solid rgba(255,154,158,.25)}
#head{display:flex;align-items:center;gap:5px;padding:9px 10px;padding-right:42px;
  position:relative;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  font-size:14px;font-weight:600;flex-shrink:0;cursor:move;touch-action:none}
#head img{width:26px;height:26px;border-radius:50%;background:#fff;
  border:2px solid rgba(255,255,255,.6);object-fit:cover;pointer-events:none;flex-shrink:0}
#head .sp{flex:1 1 0;min-width:0}
#head button{background:rgba(255,255,255,.25);border:none;color:#fff;
  padding:0 7px;height:26px;border-radius:13px;font-size:11.5px;
  cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap}
/* 关闭键脱离伸缩流：无论音乐键是否出现、窗口缩得多小，都固定在右上角可点 */
#btn-close{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  padding:0 9px;height:26px}
#head button:active{background:rgba(255,255,255,.45)}
#head button[hidden]{display:none}
#actions{display:flex;gap:6px;padding:8px 12px;background:#fff5f7;
  border-bottom:1px solid rgba(255,154,158,.2);overflow-x:auto;
  scrollbar-width:none;flex-shrink:0}
#actions::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:12px;padding:6px 14px;border-radius:14px;
  border:1px solid rgba(255,154,158,.25);background:var(--card);
  color:var(--text);cursor:pointer;font-family:inherit}
.chip:active{border-color:var(--c1);color:var(--c1);background:#fff}
#body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;
  flex-direction:column;gap:12px;
  background:linear-gradient(160deg,#fff0f5 0%,#ffe4e1 100%);
  -webkit-overflow-scrolling:touch}
#body::-webkit-scrollbar{width:4px}
#body::-webkit-scrollbar-thumb{background:var(--c1);border-radius:4px}
/* 独立于音乐搜索页的常驻迷你播放器：占用自己的布局行，不覆盖聊天气泡或输入框 */
#mini-player{display:none;align-items:center;gap:8px;padding:7px 10px;
  background:rgba(255,245,247,.98);border-top:1px solid rgba(255,154,158,.2);
  border-bottom:1px solid rgba(255,154,158,.12);flex-shrink:0;min-width:0}
#mini-player.show{display:flex}
.mini-disc{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#fff;flex-shrink:0;font-size:15px}
#mini-player.playing .mini-disc{animation:mini-spin 4s linear infinite}
@keyframes mini-spin{to{transform:rotate(360deg)}}
.mini-info{min-width:0;flex:1;cursor:pointer}
.mini-name,.mini-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-name{font-size:12px;color:var(--text)}
.mini-artist{font-size:10px;color:var(--muted);margin-top:2px}
.mini-btn{width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,154,158,.15);
  color:var(--accent);font-size:12px;flex-shrink:0;font-family:inherit}
.mini-btn:active{background:rgba(255,154,158,.35)}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:14px;
  line-height:1.55;white-space:pre-wrap;word-break:break-word;
  user-select:text;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.msg.user{align-self:flex-end;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#fff;color:var(--text);
  border-bottom-left-radius:4px;border:1px solid rgba(255,154,158,.2)}
.msg.mem{align-self:center;background:#ffe4e1;color:var(--muted);
  font-size:12px;border-radius:8px;max-width:95%;text-align:center;
  padding:6px 12px}
.msg.typing{color:var(--muted)}
.tts-btn{display:inline-flex;align-items:center;margin-top:8px;
  padding:4px 12px;border-radius:12px;background:rgba(255,154,158,.12);
  color:var(--accent);font-size:11px;cursor:pointer;
  border:1px solid rgba(255,154,158,.3)}
.tts-btn:active{background:rgba(255,154,158,.25)}
#foot{display:flex;gap:8px;padding:10px 12px;background:#fff5f7;
  border-top:1px solid rgba(255,154,158,.2);flex-shrink:0;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#input{flex:1;border:1.5px solid rgba(255,154,158,.25);border-radius:18px;
  padding:10px 16px;font-size:14px;outline:none;resize:none;
  background:var(--card);color:var(--text);max-height:100px;
  font-family:inherit;user-select:text;line-height:1.4}
#input:focus{border-color:var(--c1)}
#btn-plus{width:38px;height:38px;flex:0 0 auto;align-self:flex-end;border-radius:50%;
  border:1.5px solid rgba(255,154,158,.35);background:var(--card);color:var(--c1);
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
#btn-plus:active{opacity:.7}
#attach-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff5f7;
  border-top:1px solid rgba(255,154,158,.2);flex-shrink:0}
#attach-bar[hidden]{display:none}
#attach-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;display:none;
  border:1px solid rgba(255,154,158,.35)}
#attach-bar.has-img #attach-thumb{display:block}
#attach-info{flex:1;min-width:0;font-size:12px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#attach-del{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:none;padding:0;
  background:rgba(255,154,158,.22);color:var(--c1);font-size:15px;line-height:1}
.msg-thumb{display:block;max-width:160px;max-height:160px;border-radius:10px;
  margin-top:6px;border:1px solid rgba(255,154,158,.3)}
#send{width:60px;border-radius:18px;border:none;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;flex-shrink:0}
#send:disabled{opacity:.5}
#settings{display:none;flex-direction:column;flex:1;overflow-y:auto;
  background:#fff5f7;padding:15px;-webkit-overflow-scrolling:touch}
#settings.open{display:flex}
#settings::-webkit-scrollbar{width:4px}
#settings::-webkit-scrollbar-thumb{background:var(--c1);border-radius:4px}
.sg{margin-bottom:12px}
.sg label{display:block;font-size:12px;font-weight:600;
  color:var(--text);margin-bottom:4px}
.sg input:not([type=checkbox]):not([type=range]),.sg textarea,.sg select{
  width:100%;padding:8px 12px;border:1px solid rgba(255,154,158,.25);
  border-radius:8px;background:var(--card);color:var(--text);
  font-size:13px;font-family:inherit;user-select:text}
.sg textarea{resize:vertical;min-height:80px}
.sec-title{margin-top:15px;padding-top:10px;
  border-top:1px solid rgba(255,154,158,.3);font-size:13px;
  font-weight:bold;color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:12px}
.btn-p{flex:1;padding:10px;background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#fff;border:none;border-radius:10px;font-weight:600;
  cursor:pointer;font-size:13px;font-family:inherit}
.btn-s{flex:1;padding:10px;background:var(--card);color:var(--text);
  border:1px solid rgba(255,154,158,.25);border-radius:10px;
  cursor:pointer;font-size:13px;font-family:inherit}
.btn-s:active,.btn-p:active{opacity:.75}
.range-row{display:flex;align-items:center;gap:8px}
.range-row input[type=range]{flex:1;accent-color:var(--c1);padding:0}
.range-row span{font-size:12px;color:var(--muted);min-width:32px}
.pin-row{display:flex;align-items:center;gap:6px}
.pin-row input{flex:1;min-width:0}
.pin-row .btn-paste{flex:0 0 auto;padding:9px 14px;border-radius:12px;border:1px solid var(--c1);
  background:var(--card);color:var(--c1);font-size:13px}
.pin-row .btn-paste:active{opacity:.7}
/* 不再用 type=password：部分手机自带的安全键盘会跟 WebView 打架（弹一下就消失）。
   换成普通输入框 + CSS 遮点，既避开安全键盘，默认也不会明文露在外面。 */
input.secret{-webkit-text-security:disc}
input.secret.reveal{-webkit-text-security:none}
/* ===== 记忆页 ===== */
#memory{display:none;flex-direction:column;flex:1;overflow:hidden;background:#fff5f7}
#memory.open{display:flex}
.mem-top{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:#fff5f7;border-bottom:1px solid rgba(255,154,158,.15);flex-shrink:0}
.mem-top .grow{flex:1}
.mem-cats{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex-shrink:0;
  background:#fff5f7;border-bottom:1px solid rgba(255,154,158,.15);
  -webkit-overflow-scrolling:touch}
.mem-cats::-webkit-scrollbar{height:0}
.mem-cats button{padding:5px 12px;border-radius:12px;font-size:12px;
  border:1px solid rgba(255,154,158,.3);background:var(--card);
  color:var(--text);font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0}
.mem-cats button.on{background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#fff;border-color:transparent;font-weight:600}
.mem-cats button .cnt{opacity:.65;font-size:10px;margin-left:4px}
#mem-list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
#mem-list::-webkit-scrollbar{width:4px}
#mem-list::-webkit-scrollbar-thumb{background:var(--c1);border-radius:4px}
.mem-card{background:var(--card);border:1px solid rgba(255,154,158,.22);
  border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mem-card.pin{border-color:var(--c1);box-shadow:inset 0 0 0 1px rgba(255,154,158,.25)}
.mem-hd{display:flex;align-items:center;gap:6px}
.mem-title{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem-cat{font-size:10px;padding:2px 7px;border-radius:8px;
  background:rgba(255,154,158,.18);color:var(--accent);flex-shrink:0}
.mem-pin{font-size:10px;color:#ff9800;flex-shrink:0}
.mem-body{font-size:12px;color:var(--text);line-height:1.55;margin-top:6px;
  white-space:pre-wrap;word-break:break-word;opacity:.9;
  max-height:84px;overflow:hidden;user-select:text}
.mem-card.open .mem-body{max-height:none}
.mem-ft{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.mem-tag{font-size:10px;color:var(--muted);background:rgba(255,154,158,.12);
  padding:2px 7px;border-radius:8px}
.mem-meta{font-size:10px;color:var(--muted);margin-left:auto}
.mem-ops{display:flex;gap:6px;margin-top:8px}
.mem-ops button{flex:1;padding:6px;border-radius:9px;font-size:11px;
  border:1px solid rgba(255,154,158,.3);background:#fff5f7;
  color:var(--text);font-family:inherit;cursor:pointer}
.mem-ops button.danger{color:#d6336c;border-color:rgba(214,51,108,.35)}
#mem-empty,#mem-none{padding:40px 24px;text-align:center;color:var(--muted);
  font-size:13px;line-height:1.7}
#mem-tools{flex-shrink:0;display:none;flex-direction:column;gap:8px;
  padding:10px 12px;background:#fff;border-top:1px solid rgba(255,154,158,.2)}
#mem-tools.open{display:flex}
#mem-tools textarea{width:100%;min-height:64px;font-family:monospace;font-size:11px;
  padding:8px 10px;border:1px solid rgba(255,154,158,.25);border-radius:8px;
  background:var(--card);color:var(--text);resize:vertical}
.mem-edit{display:none;position:absolute;inset:0;background:#fff5f7;z-index:140;
  flex-direction:column;padding:14px;overflow-y:auto}
.mem-edit.open{display:flex}
.mem-edit h3{margin:0 0 12px;font-size:14px;color:var(--accent)}
.mem-edit .sg textarea{min-height:130px}
.mem-switch{display:flex;align-items:center;gap:8px;font-size:12px;
  color:var(--text);margin:10px 0}
.mem-switch input{width:16px;height:16px;accent-color:var(--c1)}

#music{display:none;flex-direction:column;flex:1;overflow:hidden;
  background:linear-gradient(160deg,#fff0f5 0%,#ffe4e1 100%)
#music.open{display:flex}
.mtop{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:#fff5f7;border-bottom:1px solid rgba(255,154,158,.15);flex-shrink:0}
.mback{background:rgba(255,154,158,.15);border:none;color:var(--accent);
  padding:4px 12px;border-radius:12px;font-size:12px;cursor:pointer;
  font-family:inherit}
.mtabs{display:flex;gap:4px;flex:1}
.mtab{padding:6px 14px;border-radius:12px;font-size:12px;cursor:pointer;
  color:var(--muted);background:transparent;border:none;font-family:inherit}
.mtab.active{background:var(--card);color:var(--accent);font-weight:600}
.msbar{display:flex;gap:8px;padding:10px 12px;background:#fff5f7;
  border-bottom:1px solid rgba(255,154,158,.2);flex-shrink:0}
.msbar input{flex:1;padding:8px 14px;
  border:1.5px solid rgba(255,154,158,.25);border-radius:16px;
  background:var(--card);font-size:13px;outline:none;
  color:var(--text);font-family:inherit;user-select:text}
.msbar input:focus{border-color:var(--c1)}
.msbar button{padding:0 16px;border:none;border-radius:16px;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  font-weight:600;cursor:pointer;font-size:13px;
  font-family:inherit;flex-shrink:0}
#music-list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
#music-list::-webkit-scrollbar{width:4px}
#music-list::-webkit-scrollbar-thumb{background:var(--c1);border-radius:4px}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:12px;cursor:pointer;margin-bottom:4px}
.mi:active{background:rgba(255,154,158,.15)}
.mi.playing{background:rgba(255,154,158,.25)}
.mi.playing .mname{color:var(--accent);font-weight:600}
.mi.loading{background:rgba(255,154,158,.2)}
.midx{width:24px;text-align:center;font-size:12px;color:var(--muted);flex-shrink:0}
.mi.playing .midx{color:var(--accent)}
.minfo{flex:1;min-width:0}
.mname{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mart{font-size:11px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdur{font-size:11px;color:var(--muted);flex-shrink:0}
.mfav{padding:4px;color:var(--accent);background:none;border:none;
  cursor:pointer;font-size:14px;flex-shrink:0}
.mfav.active{color:#ff1744}
.mempty,.mload{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
#music-lyric{padding:8px 14px;background:#fff5f7;
  border-top:1px solid rgba(255,154,158,.15);font-size:12px;
  color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-height:20px;text-align:center;flex-shrink:0}
#music-lyric.hl{color:var(--accent);font-weight:500}
#music-player{display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;
  background:#fff5f7;border-top:1px solid rgba(255,154,158,.2);flex-shrink:0;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.mp-progress{width:100%;height:4px;background:rgba(255,154,158,.25);
  border-radius:2px;cursor:pointer;position:relative;touch-action:none}
.mp-progress-bar{height:100%;
  background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:2px;
  width:0%;pointer-events:none}
.mp-row{display:flex;align-items:center;gap:6px}
.mp-btn{width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,154,158,.15);color:var(--accent);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-family:inherit}
.mp-btn:active{background:rgba(255,154,158,.35)}
.mp-play{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.mp-title{flex:1;font-size:12px;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.mp-time{font-size:10px;color:var(--muted);flex-shrink:0;
  margin-left:4px;font-family:monospace}
#lyric-modal{position:absolute;inset:0;background:rgba(74,44,58,.6);
  display:none;align-items:flex-end;border-radius:20px;z-index:100}
#lyric-modal.open{display:flex}
.lyric-box{width:100%;max-height:65%;background:#fff0f5;
  border-radius:20px;padding:20px;display:flex;flex-direction:column}
.lyric-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px}
.lyric-head h3{margin:0;font-size:15px;color:var(--accent)}
.lyric-close{background:none;border:none;font-size:22px;color:var(--muted);
  cursor:pointer;line-height:1;font-family:inherit}
.lyric-content{flex:1;overflow-y:auto;font-size:14px;line-height:2;
  color:var(--muted);text-align:center;-webkit-overflow-scrolling:touch}
.lline{padding:4px 0;cursor:pointer}
.lline.active{color:var(--accent);font-weight:600;font-size:15px}
#guide{position:absolute;inset:0;z-index:999;
  background:linear-gradient(160deg,#fff0f5 0%,#ffe4e1 100%);
  display:none;align-items:center;justify-content:center;padding:16px}
#guide.show{display:flex}
.guide-card{width:100%;max-height:100%;background:#fff;border-radius:20px;
  box-shadow:0 12px 40px rgba(255,154,158,.3);display:flex;
  flex-direction:column;overflow:hidden}
.guide-head{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.guide-head img{width:48px;height:48px;border-radius:50%;
  border:2px solid rgba(255,255,255,.7);object-fit:cover;background:#fff}
.guide-title{font-size:15px;font-weight:700}
.guide-sub{font-size:12px;opacity:.9;margin-top:2px}
.guide-steps{flex:1;overflow-y:auto;padding:14px;display:flex;
  flex-direction:column;gap:10px}
.step{display:flex;gap:10px;padding:12px 14px;border-radius:14px;
  background:#fff5f7;border:1px solid rgba(255,154,158,.2);transition:all .2s}
.step.ok{background:#e8f9ee;border-color:#a8e6b8}
.step.need{background:#fff8e1;border-color:#ffd54f}
.step-icon{width:32px;height:32px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,154,158,.2);color:var(--accent);
  font-size:16px;font-weight:bold}
.step.ok .step-icon{background:#a8e6b8;color:#fff}
.step.need .step-icon{background:#ffd54f;color:#fff}
.step-body{flex:1;min-width:0}
.step-name{font-size:13px;font-weight:600;color:var(--text)}
.step-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.step-badge{font-size:10px;padding:2px 8px;border-radius:8px;
  background:rgba(255,154,158,.15);color:var(--accent);
  margin-left:6px;vertical-align:middle}
.step.ok .step-badge{background:#a8e6b8;color:#fff}
.step-btn{align-self:flex-start;margin-top:6px;padding:5px 12px;
  font-size:11px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  font-weight:600;cursor:pointer;font-family:inherit}
.step-btn:active{opacity:.75}
.step-btn.ghost{background:#fff;color:var(--accent);
  border:1px solid rgba(255,154,158,.4)}
.guide-foot{display:flex;gap:8px;padding:12px 16px;
  border-top:1px solid rgba(255,154,158,.15);background:#fff5f7}
.guide-skip{flex:0 0 auto;padding:10px 16px;border-radius:12px;
  border:1px solid rgba(255,154,158,.3);background:#fff;color:var(--muted);
  font-size:13px;cursor:pointer;font-family:inherit}
.guide-next{flex:1;padding:10px;border-radius:12px;border:none;

<script>
(function(){
'use strict';

/* ==========================================================
 *  旧版 WebView 兼容垫片
 * ========================================================== */
if (!Promise.allSettled) {
  Promise.allSettled = function(list) {
    return Promise.all(Array.from(list).map(function(p) {
      return Promise.resolve(p).then(
        function(v) { return { status: 'fulfilled', value: v }; },
        function(e) { return { status: 'rejected', reason: e }; }
      );
    }));
  };
}

/* ==========================================================
 *  桥接层
 * ========================================================== */
const HAS_NATIVE = typeof Android !== 'undefined' && Android !== null;
const HAS_PERM   = typeof Perm !== 'undefined' && Perm !== null;

/* ---------- 存储 ---------- */
const sGet = (k, d) => {
  try {
    if (HAS_NATIVE && Android.getValue) {
      const v = Android.getValue(k, null);
      if (v !== null && v !== undefined && v !== '') {
        try { return JSON.parse(v); } catch (e) { return v; }
      }
      return d;
    }
  } catch (e) {}
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }
  catch (e) { return d; }
};
const sSet = (k, v) => {
  try {
    if (HAS_NATIVE && Android.setValue) { Android.setValue(k, JSON.stringify(v)); return; }
  } catch (e) {}
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
};

/* ---------- 网络：回调派发 ---------- */
const pendingReq = {};
let reqSeq = 0;
window.__gmCb = function(id, ok, code, text, err){
  const p = pendingReq[id];
  if (!p) return;
  delete pendingReq[id];
  if (p.timer) clearTimeout(p.timer);
  if (ok) {
    p.resolve({ status: code, text: text });
  } else {
    p.reject(new Error(err || ('HTTP ' + code)));
  }
};

function nativeReq(method, url, headers, body, timeout) {
  timeout = timeout || 20000;
  return new Promise((resolve, reject) => {
    if (!HAS_NATIVE || !Android.request) {
      // 回退 fetch（多数情况会被 CORS 拦）
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const t = setTimeout(() => { if (ctrl) ctrl.abort(); }, timeout);
      const opt = { method: method };
      if (ctrl) opt.signal = ctrl.signal;
      if (headers) opt.headers = headers;
      if (body) opt.body = body;
      fetch(url, opt)
        .then(r => { clearTimeout(t); return r.text().then(txt => ({ r, txt })); })
        .then(({ r, txt }) => {
          if (!r.ok) return reject(new Error('HTTP ' + r.status));
          resolve({ status: r.status, text: txt });
        })
        .catch(e => { clearTimeout(t); reject(e); });
      return;
    }
    const id = 'r' + (++reqSeq);
    const timer = setTimeout(() => {
      if (pendingReq[id]) { delete pendingReq[id]; reject(new Error('请求超时')); }
    }, timeout + 800);
    pendingReq[id] = { resolve, reject, timer };
    try {
      Android.request(id, method, url, JSON.stringify(headers || {}), body || '', timeout);
    } catch (e) {
      clearTimeout(timer); delete pendingReq[id]; reject(e);
    }
  });
}
const gmGet = (url, t) => nativeReq('GET', url, null, null, t).then(r => r.text);
const gmPost = (url, hdrs, body, t) => nativeReq('POST', url, hdrs, body, t);

/* ---------- 其它 ---------- */
const pAny = (arr) => typeof Promise.any === 'function'
  ? Promise.any(arr)
  : new Promise((res, rej) => {
      let n = 0; const a = Array.from(arr);
      if (!a.length) return rej(new Error('无候选'));
      a.forEach(p => Promise.resolve(p).then(res, () => {
        if (++n === a.length) rej(new Error('全部失败'));
      }));
    });

async function pMap(arr, fn, n) {
  n = n || 5;
  const r = new Array(arr.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, arr.length) }, async () => {
    while (i < arr.length) {
      const k = i++;
      try { r[k] = await fn(arr[k]); } catch (e) { r[k] = null; }
    }
  }));
  return r;
}

const errMsg = (err) => typeof err === 'string'
  ? err
  : (err && err.message) || (err && err.error && err.error.message) || String(err) || '未知错误';

const esc = (t) => {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(String(t == null ? '' : t)));
  return d.innerHTML;
};
const b64e = (s) => {
  // 不依赖 TextEncoder，兼容老 WebView
  return btoa(unescape(encodeURIComponent(String(s))));
};
const b64d = (s) => {
  return decodeURIComponent(escape(atob(String(s).replace(/\s+/g, ''))));
};
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

let toastTimer = null;
function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2400);
}
function vibrate(ms) {
  try { if (HAS_NATIVE && Android.vibrate) Android.vibrate(ms || 15); } catch (e) {}
}

/* ==========================================================
 *  自定义弹窗（替代原生 confirm，浮窗里才能正常显示）
 * ========================================================== */
let _modalCb = null;
function uiConfirm(msg, okText, title) {
  return new Promise((resolve) => {
    _modalCb = resolve;
    $('#modal-title').textContent = title || '请确认';
    $('#modal-msg').textContent = msg;
    $('#modal-ok').textContent = okText || '确定';
    $('#modal').classList.add('open');
  });
}
function closeModal(ok) {
  $('#modal').classList.remove('open');
  if (_modalCb) { const cb = _modalCb; _modalCb = null; cb(!!ok); }
}
function bindModal() {
  $('#modal-ok').onclick = () => closeModal(true);
  $('#modal-cancel').onclick = () => closeModal(false);
  $('#modal').onclick = (e) => { if (e.target === $('#modal')) closeModal(false); };
}

/* ==========================================================
 *  头像选择与裁剪
 * ========================================================== */
const AV_LOCAL = '（本地图片）';
const CP = { img: null, iw: 1, ih: 1, vp: 600, scale: 1, base: 1, min: 1, max: 1,
  tx: 0, ty: 0, drag: false, lx: 0, ly: 0, pinch: 0, pscale: 1 };

function openCropper(src) {
  const img = new Image();
  img.onload = () => {
    CP.img = img; CP.iw = img.naturalWidth || img.width; CP.ih = img.naturalHeight || img.height;
    CP.base = Math.max(CP.vp / CP.iw, CP.vp / CP.ih);
    CP.min = CP.base; CP.max = CP.base * 4;
    CP.scale = CP.base;
    CP.tx = (CP.vp - CP.iw * CP.scale) / 2;
    CP.ty = (CP.vp - CP.ih * CP.scale) / 2;
    cpClamp(); cpSyncZoom(); cpDraw();
    $('#crop-modal').classList.add('open');
  };
  img.onerror = () => toast('图片读取失败，换一张试试~');
  img.src = src;
}
function cpClamp() {
  const w = CP.iw * CP.scale, h = CP.ih * CP.scale;
  CP.tx = Math.min(0, Math.max(CP.vp - w, CP.tx));
  CP.ty = Math.min(0, Math.max(CP.vp - h, CP.ty));
}
function cpDraw() {
  const c = $('#crop-canvas'); if (!c || !CP.img) return;
  const g = c.getContext('2d');
  g.clearRect(0, 0, CP.vp, CP.vp);
  g.drawImage(CP.img, CP.tx, CP.ty, CP.iw * CP.scale, CP.ih * CP.scale);
}
function cpSyncZoom() {
  const z = Math.round(CP.scale / CP.base * 100);
  const r = $('#crop-zoom'); if (r) r.value = String(Math.min(400, Math.max(100, z)));
  const l = $('#crop-zoom-l'); if (l) l.textContent = (CP.scale / CP.base).toFixed(1) + 'x';
}
function cpZoomTo(scale) {
  const cx = (CP.vp / 2 - CP.tx) / CP.scale, cy = (CP.vp / 2 - CP.ty) / CP.scale;
  CP.scale = Math.min(CP.max, Math.max(CP.min, scale));
  CP.tx = CP.vp / 2 - cx * CP.scale;
  CP.ty = CP.vp / 2 - cy * CP.scale;
  cpClamp(); cpSyncZoom(); cpDraw();
}
function cpConfirm() {
  if (!CP.img) return;
  const out = 512, k = out / CP.vp;
  const c = document.createElement('canvas'); c.width = out; c.height = out;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, out, out);
  g.drawImage(CP.img, CP.tx * k, CP.ty * k, CP.iw * CP.scale * k, CP.ih * CP.scale * k);
  let data = '';
  try { data = c.toDataURL('image/jpeg', 0.9); }
  catch (e) { return toast('裁剪失败：' + errMsg(e)); }
  CONFIG.avatarUrl = data;
  sSet('via_ai_config', CONFIG);
  const inp = $('#set-avatar'); if (inp) inp.value = AV_LOCAL;
  applyTheme();
  $('#crop-modal').classList.remove('open');
  toast('头像已更新~');
}
function bindCrop() {
  const stage = $('#crop-modal .crop-stage');
  const rect = () => stage.getBoundingClientRect();
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      CP.drag = true; CP.lx = e.touches[0].clientX; CP.ly = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      CP.drag = false;
      CP.pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      CP.pscale = CP.scale;
    }
    e.preventDefault();
  }, { passive: false });
  stage.addEventListener('touchmove', (e) => {
    const r = rect();
    if (e.touches.length === 1 && CP.drag) {
      const t = e.touches[0];
      CP.tx += (t.clientX - CP.lx) * (CP.vp / r.width);
      CP.ty += (t.clientY - CP.ly) * (CP.vp / r.height);
      CP.lx = t.clientX; CP.ly = t.clientY;
      cpClamp(); cpDraw();
    } else if (e.touches.length === 2 && CP.pinch) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      cpZoomTo(CP.pscale * (d / CP.pinch));
    }
    e.preventDefault();
  }, { passive: false });
  const end = () => { CP.drag = false; CP.pinch = 0; };
  stage.addEventListener('touchend', end);
  stage.addEventListener('touchcancel', end);
  stage.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    CP.drag = true; CP.lx = e.clientX; CP.ly = e.clientY; e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!CP.drag || !$('#crop-modal').classList.contains('open')) return;
    const r = rect();
    CP.tx += (e.clientX - CP.lx) * (CP.vp / r.width);
    CP.ty += (e.clientY - CP.ly) * (CP.vp / r.height);
    CP.lx = e.clientX; CP.ly = e.clientY;
    cpClamp(); cpDraw();
  });
  document.addEventListener('mouseup', () => { CP.drag = false; });
  $('#crop-zoom').oninput = () => cpZoomTo(CP.base * (parseInt($('#crop-zoom').value, 10) / 100));
  $('#crop-ok').onclick = cpConfirm;
  $('#crop-cancel').onclick = () => $('#crop-modal').classList.remove('open');
  $('#crop-modal').onclick = (e) => { if (e.target === $('#crop-modal')) $('#crop-modal').classList.remove('open'); };
}

/* ==========================================================
 *  窗口等比缩放：整体缩小/放大，内容全部可见（像电脑缩放窗口）
 * ========================================================== */
let BASE = null;   // zoom=1 时窗口的 css 尺寸
let ZOOM = 1;      // 当前缩放比

function initZoom() {
  if (!(HAS_PERM && Perm.getWindowRect)) return;
  let r = null;
  try { r = JSON.parse(Perm.getWindowRect()); } catch (e) { return; }
  if (!r || !r.w || !r.h) return;
  const d = window.devicePixelRatio || 1;
  BASE = { w: Math.max(160, Math.round(r.w / d)), h: Math.max(220, Math.round(r.h / d)) };
  ZOOM = 1;
  applyZoom();
}

function applyZoom() {
  const app = $('#app');
  if (!app || !BASE) return;
  app.style.position = 'absolute';
  app.style.top = '0';
  app.style.left = '0';
  app.style.width = BASE.w + 'px';
  app.style.height = BASE.h + 'px';
  app.style.transformOrigin = 'top left';
  app.style.transform = ZOOM === 1 ? '' : 'scale(' + ZOOM + ')';
}

function bindResize() {
  if (!(HAS_PERM && Perm.setWindowRect && Perm.getWindowRect)) return;
  const handles = $$('#app .rz');
  let active = null, sx = 0, sy = 0, rect0 = null;
  const dpr = () => window.devicePixelRatio || 1;
  const readRect = () => { try { return JSON.parse(Perm.getWindowRect()); } catch (e) { return null; } };
  const down = (dir, x, y) => {
    if (!BASE) initZoom();
    if (!BASE) return;
    rect0 = readRect();
    if (!rect0 || !rect0.w) { rect0 = null; return; }
    active = dir; sx = x; sy = y;
  };
  const move = (x, y) => {
    if (!active || !rect0 || !BASE) return;
    const d = dpr();
    const dx = (x - sx) * d, dy = (y - sy) * d;
    const baseW = BASE.w * d, baseH = BASE.h * d;
    const hasE = active.indexOf('e') >= 0, hasW = active.indexOf('w') >= 0;
    const hasS = active.indexOf('s') >= 0, hasN = active.indexOf('n') >= 0;
    const tw = rect0.w + (hasE ? dx : 0) - (hasW ? dx : 0);
    const th = rect0.h + (hasS ? dy : 0) - (hasN ? dy : 0);
    // 只取一个缩放比 k：窗口宽、高与页面内容同时按 k 变，
    // 所以是「整体等比变小」而不是「变窄导致内容挤没了」。
    let k;
    if ((hasE || hasW) && (hasS || hasN)) k = Math.abs(dx) > Math.abs(dy) ? tw / baseW : th / baseH;
    else if (hasE || hasW) k = tw / baseW;
    else k = th / baseH;
    // 不让窗口超出屏幕
    const swScreen = (window.screen && window.screen.width ? window.screen.width : BASE.w) * d;
    const shScreen = (window.screen && window.screen.height ? window.screen.height : BASE.h) * d;
    const maxK = Math.min(swScreen / baseW, shScreen / baseH);
    k = Math.max(0.45, Math.min(k, Math.max(0.45, maxK)));
    const nw = Math.max(1, Math.round(baseW * k));
    const nh = Math.max(1, Math.round(baseH * k));
    let rx = rect0.x, ry = rect0.y;
    if (hasW) rx = rect0.x + rect0.w - nw;   // 从左边拖：右边缘固定
    if (hasN) ry = rect0.y + rect0.h - nh;   // 从上边拖：下边缘固定
    ZOOM = k;
    applyZoom();
    try { Perm.setWindowRect(rx, ry, nw, nh); } catch (e) {}
  };
  const up = () => { active = null; rect0 = null; };
  handles.forEach((h) => {
    const dir = h.dataset.dir;
    h.addEventListener('touchstart', (e) => { const t = e.touches[0]; down(dir, t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
    h.addEventListener('mousedown', (e) => { if (e.button === 0) { down(dir, e.clientX, e.clientY); e.preventDefault(); } });
  });
  document.addEventListener('touchmove', (e) => { if (active) { const t = e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); } }, { passive: false });
  document.addEventListener('mousemove', (e) => { if (active) move(e.clientX, e.clientY); });
  document.addEventListener('touchend', up);
  document.addEventListener('touchcancel', up);
  document.addEventListener('mouseup', up);
}

function embPack(arr) {

  for (let i = 0; i < arr.length; i++) {
    const v = Math.max(-1, Math.min(1, Number(arr[i]) || 0));
    u8[i] = Math.round((v + 1) / 2 * 255);
  }
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return 'q8:' + btoa(s);
}
function embUnpack(str) {
  if (!str || str.indexOf('q8:') !== 0) return null;
  try {
    const s = atob(str.slice(3));
    const f = new Float32Array(s.length);
    for (let i = 0; i < s.length; i++) f[i] = (s.charCodeAt(i) / 255) * 2 - 1;
    return f;
  } catch (e) { return null; }
}
function memCos(a, b) {
  let d = 0, na = 0, nb = 0;
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) { const x = a[i], y = b[i]; d += x * y; na += x * x; nb += y * y; }
  if (!na || !nb) return 0;
  return d / Math.sqrt(na * nb);
}
function memVecReady() {
  return !!(MEMCFG.vecEnabled && MEMCFG.vecBase && MEMCFG.vecKey && MEMCFG.vecModel);
}
async function memEmbed(texts) {
  if (!memVecReady()) throw new Error('未启用向量检索或配置不全');
  const body = JSON.stringify({ model: MEMCFG.vecModel, input: texts });
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + MEMCFG.vecKey };
  const r = await nativeReq('POST', MEMCFG.vecBase.replace(/\/$/, '') + '/embeddings', headers, body, 60000);
  const d = JSON.parse(r.text);
  if (d.error) throw new Error(d.error.message || '向量接口错误');
  if (!d.data || !d.data.length) throw new Error('向量接口返回异常');
  return d.data.map(x => x.embedding || x.embeddings || []);
}
/** 后台给条目算向量，失败就算了，不影响任何功能 */
async function memTouchEmbed(e) {
  if (!memVecReady() || e.emb) return;
  try {
    const r = await memEmbed([(e.title || '') + '\n' + (e.content || '').slice(0, 1200)]);
    if (r && r[0] && r[0].length) { e.emb = embPack(r[0]); memSaveAll(); }
  } catch (err) {}
}

/* ---- 检索 ---- */
function memKeywords(s) {
  const t = String(s || '').toLowerCase().match(/[a-z0-9_]+|[\u4e00-\u9fa5]/g) || [];
  const stop = { '的': 1, '了': 1, '是': 1, '我': 1, '你': 1, '他': 1, '她': 1, '它': 1,
    '和': 1, '与': 1, '在': 1, '有': 1, '吗': 1, '呢': 1, '吧': 1, '啊': 1, '就': 1, '都': 1,
    'the': 1, 'a': 1, 'an': 1, 'is': 1, 'to': 1, 'of': 1, 'and': 1, 'my': 1, 'me': 1 };
  const uniq = [];
  for (const x of t) if (!stop[x] && uniq.indexOf(x) < 0) uniq.push(x);
  if (t.length > 1 && uniq.length && /[a-z0-9]/.test(t.join(''))) {
    // 英文/拼音：额外把整串当成一个词，方便匹配 "react native"
    const whole = t.join(' ');
    if (whole.indexOf(' ') > 0 && uniq.indexOf(whole) < 0) uniq.push(whole);
  }
  return uniq;
}
function memScore(e, kws) {
  if (!kws.length) return 0;
  const title = String(e.title || '').toLowerCase();
  const body = String(e.content || '').toLowerCase();
  const tags = (e.tags || []).join(' ').toLowerCase();
  const cat = memCat(e).toLowerCase();
  let sc = 0;
  for (const k of kws) {
    if (!k) continue;
    if (title.indexOf(k) >= 0) sc += 6;
    if (tags.indexOf(k) >= 0) sc += 4;
    if (cat.indexOf(k) >= 0) sc += 2;
    if (body.indexOf(k) >= 0) sc += 1;
  }
  return sc;
}
/** 统一入口：关键词（+可选向量）混合检索，返回排好序的条目 */
async function memSearch(opts) {
  const o = opts || {};
  const kws = memKeywords(o.keyword || '');
  const limit = Math.max(1, Math.min(50, parseInt(o.limit, 10) || 15));
  let pool = MEM.slice();
  if (o.category) pool = pool.filter(e => memCat(e) === o.category);

  let qv = null;
  if (memVecReady() && o.keyword) {
    try { const r = await memEmbed([o.keyword]); qv = (r && r[0] && r[0].length) ? r[0] : null; } catch (e) { qv = null; }
  }

  const scored = pool.map(e => {
    const base = memScore(e, kws);
    let bonus = 0;
    if (qv) {
      const ev = embUnpack(e.emb);
      if (ev && ev.length === qv.length) bonus += memCos(ev, qv) * 10;
    }
    if (e.pinned) bonus += 1.5;                    // 重要的稍微往上抬
    bonus += Math.min(3, (e.hits || 0) * 0.3);     // 常用的也抬一点
    return { e, base: base, sc: base + bonus, bonus: bonus };
  });

  if (kws.length || qv) {
    // 带关键词搜索时，没沾上边的就别硬凑上来（只有向量特别高或者重要到离谱的才留）
    const kept = scored.filter(x => x.base > 0 || (qv && x.bonus > 4));
    if (kept.length) {
      kept.sort((a, b) => b.sc - a.sc || String(b.e.updatedAt).localeCompare(String(a.e.updatedAt)));
      return kept.slice(0, limit).map(x => x.e);
    }
    return [];
  }
  scored.sort((a, b) => String(b.e.updatedAt || '').localeCompare(String(a.e.updatedAt || '')));
  return scored.slice(0, limit).map(x => x.e);
}

/* ---- 常驻区：每轮都进 prompt 的那一小块，体积恒定 ---- */
function memResidentBlock() {
  if (!MEM.length) return '';
  const counts = {};
  MEM.forEach(e => { const c = memCat(e); counts[c] = (counts[c] || 0) + 1; });
  const catLine = Object.keys(counts).map(c => c + '×' + counts[c]).join('、');
  const pins = MEM.filter(e => e.pinned)
    .sort((a, b) => (b.hits || 0) - (a.hits || 0) || String(b.updatedAt).localeCompare(String(a.updatedAt)))
    .slice(0, MEM_PIN_MAX);
  const pinIds = {};
  pins.forEach(e => { pinIds[e.id] = 1; });
  const recents = MEM.slice()
    .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')))
    .filter(e => !pinIds[e.id])
    .slice(0, MEM_NEW_MAX);
  const line = (e) => '- [' + e.id + '] ' + (e.title || '（无标题）') + '（' + memCat(e) + '）';
  let s = '【长期记忆库】本机存着 ' + MEM.length + ' 条记忆，分类：' + catLine + '。\n';
  s += '下面只列出了索引，正文不在上下文里。需要细节时用 list_memories 检索、read_memory 读取，不要凭标题猜内容。\n';
  if (pins.length) s += '★ 重要：\n' + pins.map(line).join('\n') + '\n';
  if (recents.length) s += '☆ 最近：\n' + recents.map(line).join('\n') + '\n';
  s += '聊天里得到值得长期记住的信息，用 save_memory 存下来（先 list_memories 查重，同一件事有变化用 update_memory）；只有用户明确说要删，才用 delete_memory。';
  return s;
}

function memMigrateLegacy() {

  }

/* ---- 导出 ---- */
function memExportJSON() {
  const payload = { v: 1, type: 'elly-memory', exportedAt: memNowISO(), memories: MEM };
  return JSON.stringify(payload, null, 2);
}
function memExportMarkdown() {
  let s = '# 爱莉希雅的长期记忆\n\n';
  s += '> 导出时间：' + memNowISO() + '，共 ' + MEM.length + ' 条\n\n';
  const byCat = {};
  MEM.forEach(e => { const c = memCat(e); (byCat[c] = byCat[c] || []).push(e); });
  const order = MEM_CATS.concat(Object.keys(byCat).filter(c => MEM_CATS.indexOf(c) < 0));
  order.forEach(c => {
    const list = byCat[c];
    if (!list || !list.length) return;
    s += '## ' + c + '\n\n';
    list.forEach(e => {
      s += '### ' + (e.pinned ? '★ ' : '') + e.title + '\n\n';
      s += (e.content || '').trim() + '\n\n';
      const meta = [];
      if (e.tags && e.tags.length) meta.push('标签：' + e.tags.join('、'));
      meta.push('创建：' + String(e.createdAt).slice(0, 10));
      meta.push('更新：' + String(e.updatedAt).slice(0, 10));
      s += '_' + meta.join('　|　') + '_\n\n';
    });
  });
  return s;
}
/** 从 Markdown 里尽量还原条目（不认识的一律进「其他」，不会丢内容） */
function memParseMarkdown(md) {
  const out = [];
  let cat = '其他', cur = null, buf = [];
  const flush = () => {
    if (!cur) return;
    const body = buf.join('\n').trim();
    out.push(memNormalize({ cat: cat, title: cur.title, content: body || cur.title, pinned: cur.pinned, tags: [], src: 'import' }));
    cur = null; buf = [];
  };
  String(md).split(/\r?\n/).forEach(raw => {
    const line = raw;
    const h2 = line.match(/^##\s+(.+?)\s*$/);
    const h3 = line.match(/^###\s+(.+?)\s*$/);
    if (h3) { flush(); cur = { title: h3[1].replace(/^★\s*/, '').trim(), pinned: /^★/.test(h3[1].trim()) }; return; }
    if (h2) { flush(); cat = h2[1].trim(); return; }
    if (!cur) return;
    if (/^_.*_$/.test(line.trim())) return;   // 元信息行
    if (/^>/.test(line.trim())) return;        // 引用
    buf.push(line);
  });
  flush();
  return out.filter(e => e.title && e.title !== '（无标题）');
}
function memImport(text, replace) {
  const raw = String(text || '').trim();
  if (!raw) throw new Error('内容是空的');
  let items = null;
  try {
    const d = JSON.parse(raw);
    if (Array.isArray(d)) items = d;
    else if (d && Array.isArray(d.memories)) items = d.memories;
  } catch (e) {
    try {
      const d = JSON.parse(b64d(raw));
      if (Array.isArray(d)) items = d;
      else if (d && Array.isArray(d.memories)) items = d.memories;
    } catch (e2) { items = null; }
  }
  if (!items) items = memParseMarkdown(raw);
  if (!items || !items.length) throw new Error('没解析出任何记忆');

  if (replace) MEM = [];
  let added = 0, skipped = 0;
  items.forEach(it => {
    if (!it || typeof it !== 'object') return;
    const e = memNormalize(Object.assign({}, it, { src: it.src || 'import' }));
    const same = MEM.find(x => x.content.trim() === e.content.trim() && x.title === e.title);
    if (same) { skipped++; return; }
    // 导入的 id 可能和现有的撞车
    while (MEM.some(x => x.id === e.id)) e.id = memNewId();
    e.emb = '';   // 向量是模型相关的，重新算
    MEM.push(e);
    added++;
    if (memVecReady()) memTouchEmbed(e);
  });
  memSaveAll();
  return { added: added, skipped: skipped };
}

/** 把对话里值得长期记住的东西整理进记忆库（让 AI 自己决定存什么） */
async function memSummarize() {
  const non = history.filter(m => m.role !== 'system');
  if (non.length < 4) return toast('对话太短，再聊几句吧~');
  if (sending) return;
  const idx = MEM.length
    ? MEM.map(e => '- [' + e.id + '] ' + e.title + '（' + memCat(e) + '）').join('\n')
    : '（记忆库现在还是空的）';
  const convo = non.map(m => (m.role === 'user' ? '用户' : (CONFIG.assistantName || 'AI')) + '：' + textOfContent(m.content)).join('\n');
  if (!(await uiConfirm('把这段对话里值得长期记住的东西整理进记忆库？', '开始整理', '总结记忆'))) return;

      '下面是已有记忆的索引，同一件事请用 update_memory 补充修改，不要重复新建：\n' + idx +
      '\n\n【本次对话】\n' + convo;
    await chatReqTools([
      { role: 'system', content: CONFIG.systemPrompt },
      { role: 'user', content: p }
    ]);
    ok = true;
  } catch (e) {
    ld.remove();
    addMsg('assistant', '整理记忆失败：' + errMsg(e));
  }
  if (ok) {
    ld.remove();
    toast('记忆已整理：现在共 ' + MEM.length + ' 条');
    renderMemory();
    if (await uiConfirm('要不要顺便把当前对话清空？', '清空对话', '清理对话')) {

  }
  sending = false;
}

    btn.disabled = true;
  } else if (state === 'playing') {

  if (curPlayBtn) setBtn(curPlayBtn, 'idle');

function toggleTTS(text, btn) {
  if (!CONFIG.ttsEnabled) return;
  if (curPlayBtn === btn) {
    try { HAS_NATIVE && Android.stopSpeak && Android.stopSpeak(); } catch (e) {}
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    setBtn(btn, 'idle');
    curPlayBtn = null;
    return;
  }
  if (curPlayBtn) {
    try { HAS_NATIVE && Android.stopSpeak && Android.stopSpeak(); } catch (e) {}
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    setBtn(curPlayBtn, 'idle');
  }
  curPlayBtn = btn;
  setBtn(btn, 'loading');
  if (HAS_NATIVE && Android.speak) {
    try {
      Android.speak(text, CONFIG.ttsRate);
      setTimeout(() => { if (curPlayBtn === btn) setBtn(btn, 'playing'); }, 200);
    } catch (e) { setBtn(btn, 'idle'); curPlayBtn = null; toast('朗读失败：' + errMsg(e)); }
  } else if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = CONFIG.ttsRate;
    u.onstart = () => setBtn(btn, 'playing');
    u.onend = u.onerror = () => { setBtn(btn, 'idle'); curPlayBtn = null; };
    speechSynthesis.speak(u);
  } else {
    setBtn(btn, 'idle');
    curPlayBtn = null;
    toast('当前设备不支持朗读');
  }
}

function captureScreenJS() {
  return new Promise((resolve) => {
    if (!(HAS_PERM && Perm.captureScreen)) return resolve('');
    let done = false;
    const finish = (v) => {
      if (done) return;
      done = true;
      window.__shotDone = null;
      resolve(v || '');
    };
    const timer = setTimeout(() => finish(''), 45000);
    window.__shotDone = (d) => { clearTimeout(timer); finish(d); };
    try { Perm.captureScreen(); } catch (e) { clearTimeout(timer); finish(''); }
  });
}

async function visionDescribe(dataUrl, hint) {

    ? d[0].translations[0].text : d[0];

function splitChunks(text, limit) {
  const paras = String(text).split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
  const out = []; let buf = '';
  for (const p of paras) {
    if ((buf + '\n\n' + p).length > limit && buf) { out.push(buf); buf = p; }
    else buf = buf ? buf + '\n\n' + p : p;
  }
  if (buf) out.push(buf);
  return out.length ? out : [String(text).slice(0, limit)];
}

function parseVars(t) {
  const n = new Date();
  const p = (x) => String(x).padStart(2, '0');
  const ts = `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`;
  let s = String(t).replace(/\{\{time\}\}/g, ts);
  // 其余变量按需惰性求值：提示词里写了才会去读，避免每次聊天都白描一遍屏幕
  if (s.indexOf('{{screen_text}}') >= 0) {
    s = s.replace(/\{\{screen_text\}\}/g, () => readScreenText() || '（读不到屏幕内容）');
  }
  if (s.indexOf('{{page_url}}') >= 0) {
    s = s.replace(/\{\{page_url\}\}/g, () => currentPageUrl() || '（未知）');
  }
  if (s.indexOf('{{clipboard}}') >= 0) {
    s = s.replace(/\{\{clipboard\}\}/g, () => readClipboard() || '（空）');
  }
  return s;
}

async function chatReq(messages, skipParse) {
  if (!CONFIG.apiKey) throw new Error('未填写 API Key，请到设置里配置');
  const memBlock = memResidentBlock();
  const proc = messages.map((m, i) => {
    if (m.role !== 'system') return m;
    let c = skipParse ? m.content : parseVars(m.content);
    if (i === 0 && memBlock) c = c + '\n\n' + memBlock;
    return { role: 'system', content: c };
  });
  const body = JSON.stringify({ model: CONFIG.model, messages: proc, stream: false });
  const headers = {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + CONFIG.apiKey
  };
  const r = await nativeReq('POST', CONFIG.apiBase.replace(/\/$/, '') + '/chat/completions',
    headers, body, 60000);
  const d = JSON.parse(r.text);
  if (d.error) throw new Error(d.error.message || 'API 错误');
  if (!d.choices || !d.choices[0]) throw new Error('响应格式异常');
  return d.choices[0].message.content || '';
}

function findArr(o, d) {
  d = d || 0;
  if (d > 4 || !o || typeof o !== 'object') return null;
  if (Array.isArray(o) && o.length && typeof o[0] === 'object'
      && (o[0].name || o[0].song || o[0].title || o[0].songname)) return o;
  for (const k of ['songs', 'data', 'result', 'list', 'items', 'tracks', 'song_list']) {
    if (o[k]) { const f = findArr(o[k], d + 1); if (f) return f; }
  }
  for (const k of Object.keys(o)) {
    if (o[k] && typeof o[k] === 'object') {
      const f = findArr(o[k], d + 1); if (f) return f;
    }
  }
  return null;
}
function norm(raw, src) {
  const name = raw.name || raw.song || raw.title || raw.songname || raw.songName || '未知歌曲';
  let art = raw.artist || raw.artists || raw.singer || raw.author || raw.singerName ||
    raw.artistName || raw.artist_name || raw.albumArtist || raw.ar || raw.artistsName || '';
  if (Array.isArray(art)) art = art.map(a => typeof a === 'object' ? (a.name || a.artistName || a.id || '') : a).filter(Boolean).join(' / ');
  if (art && typeof art === 'object') art = art.name || art.artistName || art.id || '';
  art = String(art || '').trim();
  // 部分公共接口会用“某某/未知”占位，不能把它当成真实作者显示。
  if (!art || /^(某某|未知|未知歌手|unknown|undefined|null)$/i.test(art)) art = '未知歌手';
  let duration = raw.duration; if (duration == null) duration = raw.interval;
  if (duration == null) duration = raw.length; if (duration == null) duration = raw.duration_ms;
  if (duration == null) duration = 0;
  if (typeof duration === 'string' && /^\d+:\d+(?:\.\d+)?$/.test(duration)) {
    const p = duration.split(':'); duration = (Number(p[0]) * 60 + Number(p[1])) * 1000;
  } else {
    duration = Number(duration) || 0;
    // search 接口常返回秒，播放器显示统一使用毫秒。
    if (duration > 0 && duration < 1000) duration *= 1000;
  }
  return {
    id: String(raw.id || raw.url_id || raw.song_id || raw.songmid || raw.mid || raw.songId || ''),
    name: String(name), artist: art, duration, source: src
  };
}
function parseLrc(t) {
  if (!t || typeof t !== 'string') return [];
  const out = [], re = /\[(\d+):(\d+(?:\.\d+)?)\]([^\n]*)/g;
  let m;
  while ((m = re.exec(t))) {
    let s = m[3].trim().replace(/<\/?[a-z][^>]*>/gi, '').trim();
    if (!s) continue;
    if (/^\[(ar|ti|al|by|offset|re|ve|length|kana|t_time|#)/i.test(s)) continue;
    if (/^(作词|作曲|编曲|制作人|监制|出品|发行|词|曲|制作|OP|SP|混音|母带|录音|配唱|和声|吉他|贝斯|鼓|键盘|弦乐|人声|出品人|监制)\s*[:：]\s*.*$/.test(s) && s.length < 40) continue;
    if (/^(某某|未知|unknown|undefined|null)$/i.test(s)) continue;
    if (/^[\s\-—·。，、！？!?,.;:：；]+$/.test(s)) continue;
    out.push({ t: parseInt(m[1]) * 60 + parseFloat(m[2]), text: s });
  }
  return out.sort((a, b) => a.t - b.t);
}

function parseLyricResponse(text) {
  const raw = String(text || '').trim();
  if (!raw) return { lyric: '', tlyric: '' };
  try {
    const d = JSON.parse(raw);
    if (typeof d === 'string') return { lyric: d, tlyric: '' };
    if (d && typeof d === 'object') {
      return { lyric: d.lyric || d.lrc || d.lyrics || '', tlyric: d.tlyric || d.trans || '' };
    }
  } catch (e) { /* plain LRC */ }
  return { lyric: raw, tlyric: '' };
}

function getAudio() {

    a.onplay = () => { M.isPlaying = true; M.pendingPlay = false; M.lastError = ''; updateBar(); updateHL(); updateMini(); };

async function playAt(i) {

  if (rid !== M.requestId) return;

  if (lyrR.status === 'fulfilled' && lyrR.value && lyrR.value.lyric) {
    M.lyrics = parseLrc(lyrR.value.lyric);
    updateLyricModal();
  }
  if (urlR.status === 'rejected') {
    M.lastError = errMsg(urlR.reason);
    M.loadingIndex = -1; updateLoading(-1); updateBar(); updateMini(); return;
  }
  a.src = urlR.value;
  M.loadingIndex = -1; updateLoading(-1); updateBar(); updateMini();

  catch (e) {

async function execTool(name, args) {
  if (name === 'read_screen') {
    const t = readScreenText();
    if (!t) return { success: false, error: '读不到屏幕内容（可能无障碍未开启，或当前界面没有可读文字）' };
    return { success: true, text: t.slice(0, 6000) };
  }
  if (name === 'get_current_page') {
    const u = currentPageUrl();
    return u ? { success: true, url: u } : { success: false, error: '没有识别到浏览器地址栏' };
  }
  if (name === 'screenshot') {
    const shot = await captureScreenJS();

  }

    const list = await memSearch({ keyword: args.keyword || '', category: args.category || '', limit: args.limit || 15 });

      id: e.id, cat: memCat(e), title: e.title,

    if (!ids.length) return { success: false, error: '缺少记忆编号' };
    const out = [], miss = [];
    for (const id of ids) {
      const e = memFind(String(id));
      if (!e) { miss.push(String(id)); continue; }
      e.hits = (e.hits || 0) + 1;
      out.push({ id: e.id, cat: memCat(e), title: e.title, content: e.content, tags: e.tags || [],
        pinned: !!e.pinned, createdAt: e.createdAt, updatedAt: e.updatedAt });
    }

    return { success: true, count: out.length, memories: out, missing: miss };
  }
  if (name === 'list_memory_categories') {
    const counts = {};
    MEM.forEach(e => { const c = memCat(e); counts[c] = (counts[c] || 0) + 1; });
    return { success: true, total: MEM.length, preset: MEM_CATS, categories: counts };
  }
  if (name === 'save_memory') {
    if (!args.title || !args.content) return { success: false, error: '标题和正文都要有' };
    const dup = MEM.find(e => e.title === String(args.title).trim());
    if (dup) return { success: false, error: '已有一条同名记忆（' + dup.id + '），要补充或修改请改用 update_memory。' };
    const e = memAdd({
      title: String(args.title).trim(), content: String(args.content).trim(),
      cat: String(args.category || '其他').trim() || '其他',
      tags: Array.isArray(args.tags) ? args.tags : [],
      pinned: !!args.pinned, src: 'ai'
    });
    return { success: true, id: e.id, cat: memCat(e), saved: e.title };
  }
  if (name === 'update_memory') {
    if (!args.id) return { success: false, error: '缺少记忆编号' };
    if (!memFind(String(args.id))) return { success: false, error: '没有编号为 ' + args.id + ' 的记忆' };
    const patch = {};
    if (args.title !== undefined) patch.title = args.title;
    if (args.content !== undefined) patch.content = args.content;
    if (args.category !== undefined) patch.cat = args.category;
    if (args.tags !== undefined) patch.tags = args.tags;
    if (args.pinned !== undefined) patch.pinned = args.pinned;

    const ok = await uiConfirm('爱莉希雅想删掉这条记忆：\n\n' + e.title + '\n' + String(e.content || '').slice(0, 120) + why, '同意删除', '记忆删除授权');
    if (!ok) return { success: false, error: '用户没有同意删除，这条记忆保留着。', denied: true };
    memDel(e.id);

      }

    } catch (e) { return { success: false, error: errMsg(e) }; }
  }
  if (name === 'music_control') {

        case 'favorite': {
          const s = M.playlist[M.currentIndex];
          if (!s) return { success: false, error: '没有播放歌曲' };
          toggleFav(s);
          return { success: true, action: isFav(s) ? 'favorited' : 'unfavorited', song: s.name };
        }
        default: return { success: false, error: '未知命令' };
      }
    } catch (e) { return { success: false, error: errMsg(e) }; }
  }
  return { success: false, error: '未知工具' };
}

let toolsBroken = false;

/** 找出对话里最后一条带图片的 user 消息（截图 / 用户上传的图片） */
function lastImageMsgIndex(list) {
  for (let i = list.length - 1; i >= 0; i--) {
    const m = list[i];
    if (!m || m.role !== 'user' || !Array.isArray(m.content)) continue;
    if (m.content.some(p => p && p.type === 'image_url')) return i;
  }
  return -1;
}
/** 多模态消息里取出文字部分 */
function textOfContent(c) {
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) {
    const t = c.find(p => p && p.type === 'text');
    return t ? (t.text || '') : '';
  }
  return '';
}

async function chatReqTools(messages) {
  if (!CONFIG.apiKey) throw new Error('未填写 API Key，请到设置里配置');
  if (toolsBroken) return await chatReq(messages);
  const proc = (function () {
    const memBlock = memResidentBlock();
    return messages.map((m, i) => {
      if (m.role !== 'system') return m;
      const c = parseVars(m.content);
      return { role: 'system', content: (i === 0 && memBlock) ? c + '\n\n' + memBlock : c };
    });
  })();
  const tools = buildTools(), MAX = 5;
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.apiKey };
  const url = CONFIG.apiBase.replace(/\/$/, '') + '/chat/completions';
  let imageMsg = null, imageDataUrl = '';
  const hasVision = !!(CONFIG.visionBase && CONFIG.visionKey && CONFIG.visionModel);

  for (let r = 0; r < MAX; r++) {
    const body = JSON.stringify({ model: CONFIG.model, messages: proc, stream: false, tools, tool_choice: 'auto' });
    let msg = null, fallback = false, errText = '';
    try {
      const resp = await nativeReq('POST', url, headers, body, 60000);
      const d = JSON.parse(resp.text);
      if (d.error) throw new Error(d.error.message || 'API 错误');
      msg = d.choices && d.choices[0] && d.choices[0].message;
      if (!msg) throw new Error('响应格式异常');
    } catch (e) {
      errText = errMsg(e);
      // 对话模型不吃图片 → 先用识图模型看懂，再换成文字重试（截图和用户上传的图片都走这里）
      const imgIdx = hasVision ? lastImageMsgIndex(proc) : -1;
      if (imgIdx >= 0) {
        const part = (proc[imgIdx].content || []).find(p => p && p.type === 'image_url');
        const data = part && part.image_url && part.image_url.url;
        const isShot = proc[imgIdx] === imageMsg;
        let desc = '';
        try {
          desc = await visionDescribe(data, isShot
            ? '这是用户手机当前的屏幕截图。请如实、详细地描述画面：是什么应用、有哪些文字、用户大概在做什么。用中文回答，不要编造看不到的内容。'
            : '这是用户主动发给你的图片。请如实、详细地描述画面：画的是什么、有哪些文字、大概是做什么用的。用中文回答，不要编造看不到的内容。');
        } catch (e2) { desc = ''; }
        if (data && desc) {
          const keep = textOfContent(proc[imgIdx].content);
          proc[imgIdx] = { role: 'user', content: (keep ? keep + '\n\n' : '') + '[识图模型对这张图片的描述]\n' + desc };
          if (isShot) { imageMsg = null; imageDataUrl = ''; }
          continue;
        }
      }
      if (/tool|function|400/i.test(errText)) { fallback = true; } else { throw new Error(errText); }
    }
    if (fallback) { toolsBroken = true; return await chatReq(messages); }
    if (msg === null) return await chatReq(messages);
    if (!msg.tool_calls || !msg.tool_calls.length) return msg.content || '';

    proc.push({ role: 'assistant', content: msg.content || '', tool_calls: msg.tool_calls });
    pendingShotImage = '';
    for (const c of msg.tool_calls) {
      let result;
      try { result = await execTool(c.function.name, JSON.parse(c.function.arguments || '{}')); }
      catch (e) { result = { success: false, error: errMsg(e) }; }
      proc.push({ role: 'tool', tool_call_id: c.id, content: JSON.stringify(result) });
    }
    // tool 结果不能带图：截图另行作为一条 user 消息交给模型
    if (pendingShotImage) {
      imageDataUrl = pendingShotImage;
      pendingShotImage = '';
      imageMsg = { role: 'user', content: [
        { type: 'text', text: '（这是刚刚截取的当前屏幕画面，请据此回答用户的问题）' },
        { type: 'image_url', image_url: { url: imageDataUrl } }
      ] };
      proc.push(imageMsg);
    }
  }
  return '（工具调用次数过多，先歇一歇~）';
}
const chatSmart = (m) => chatReqTools(m);

/** 给刚发出的那条用户消息挂一张缩略图（只用于显示，不写进历史） */
function attachThumbToLast(dataUrl) {
  const last = $('#body').lastElementChild;
  if (!last || !dataUrl) return;
  const img = document.createElement('img');
  img.className = 'msg-thumb';
  img.src = dataUrl;

async function send() {
  const inputEl = $('#input');
  const t = inputEl.value.trim();
  const att = pendingAttachment;
  if ((!t && !att) || sending) return;
  sending = true; $('#send').disabled = true;
  inputEl.value = ''; inputEl.style.height = 'auto';

  addMsg('user', t || (att && att.kind === 'image' ? '（图片）' : '（文件）'));
  if (att && att.kind === 'image') attachThumbToLast(att.dataUrl);
  clearAttachment();

  const ld = addTyping();
  try {
    let msgs;
    if (att && att.kind === 'image') {
      // 图片只放在本轮请求里，不写进本地历史：dataURL 太大会把设置存爆
      msgs = history.concat([{ role: 'user', content: [
        { type: 'text', text: t || '帮我看看这张图片~' },
        { type: 'image_url', image_url: { url: att.dataUrl } }
      ] }]);
      history.push({ role: 'user', content: (t ? t + ' ' : '') + '（我发了一张图片给你看）' });
    } else if (att && att.kind === 'text') {
      msgs = history.concat([{ role: 'user', content:
        '【我上传的文件：' + att.name + '】\n' + att.text + '\n\n' + (t || '帮我看看这个文件~') }]);
      history.push({ role: 'user', content: (t ? t + ' ' : '') + '（我上传了文件 ' + att.name + '）' });
    } else if (att) {
      const kb = Math.max(1, Math.round((att.size || 0) / 1024));
      msgs = history.concat([{ role: 'user', content:
        '（我上传了一个文件 ' + att.name + '，约 ' + kb + 'KB，这个格式我这边读不出正文）\n\n' + (t || '这个文件你能看懂吗？') }]);
      history.push({ role: 'user', content: (t ? t + ' ' : '') + '（我上传了文件 ' + att.name + '）' });
    } else {
      history.push({ role: 'user', content: t });
      msgs = history;
    }
    saveHistory();
    const r = await chatSmart(msgs);
    ld.remove();
    addMsg('assistant', r);
    history.push({ role: 'assistant', content: r });
    saveHistory();
  } catch (e) {
    ld.remove();
    addMsg('assistant', '错误：' + errMsg(e));
  }
  sending = false; $('#send').disabled = false;
}

async function handleQuickAction(key) {
  if (sending) { toast('正在思考中，稍等一下嘛~'); return; }

  // 翻译屏幕
  if (key === 'trans_screen') return await translateScreen();

  let prompt = '', label = '';
  if (key === 'sum_screen') { label = '总结屏幕'; prompt = '请总结以下内容的核心要点：'; }
  else if (key === 'points') { label = '要点提炼'; prompt = '请提取以下内容的关键要点，用简洁的条目列出：'; }
  else if (key === 'explain') { label = '通俗解释'; prompt = '请用通俗易懂的语言解释以下内容：'; }
  else return;

  let content = readScreen();
  if (!content) content = readClipboard();
  if (!content) {
    toast('读不到内容呀~\n请在引导里开启无障碍，或先复制一段文字');
    return;
  }

  sending = true; $('#send').disabled = true;
  addMsg('user', `【${label}】`);
  const ld = addTyping();
  try {
    const r = await chatSmart([{ role: 'user', content: prompt + '\n\n' + content.slice(0, 6000) }]);
    ld.remove();
    addMsg('assistant', r);
    history.push({ role: 'user', content: `【${label}】` });
    history.push({ role: 'assistant', content: r });
    saveHistory();
  } catch (e) {
    ld.remove();
    addMsg('assistant', '错误：' + errMsg(e));
  }
  sending = false; $('#send').disabled = false;
}

async function translateScreen() {
  let text = readScreen();
  let fromClip = false;
  if (!text) { text = readClipboard(); fromClip = true; }
  if (!text) {
    toast('读不到内容呀~\n请在引导里开启无障碍，或先复制一段文字');
    return;
  }
  const url = currentPageUrl();
  const chunks = splitChunks(text, 800);

  sending = true; $('#send').disabled = true;
  addMsg('user', `【翻译${fromClip ? '剪贴板' : '屏幕'}】${url ? '\n' + url : ''}`);
  const ld = addTyping();
  try {
    const translated = await pMap(chunks, async (c) => {
      try { return await transGoogle(c); } catch (e) { return null; }
    }, 3);

    ld.remove();
    const okCount = translated.filter(Boolean).length;
    if (!okCount) throw new Error('翻译接口全部失败，请检查网络');

    const joined = chunks.map((c, i) =>
      `【原文】\n${c}\n\n【译文】\n${translated[i] || '（本条失败）'}`
    ).join('\n\n———\n\n');

    addMsg('assistant', joined);
    history.push({ role: 'user', content: `【翻译${fromClip ? '剪贴板' : '屏幕'}】` });
    history.push({ role: 'assistant', content: joined });
    saveHistory();

    // 顺手写回剪贴板
    const onlyTrans = translated.filter(Boolean).join('\n\n');
    if (onlyTrans && writeClipboard(onlyTrans)) {
      toast('译文已复制到剪贴板~');
    }
  } catch (e) {
    ld.remove();
    addMsg('assistant', '翻译失败：' + errMsg(e));
  }
  sending = false; $('#send').disabled = false;
}

    apiKey: $('#set-apikey').value.trim(),
    model: $('#set-model').value.trim(),
    assistantName: $('#set-name').value.trim() || DC.assistantName,
    maxContextTurns: parseInt($('#set-turns').value, 10) || 10,
    ttsEnabled: groupVal('tts') === 'true',
    ttsRate: parseFloat($('#set-tts-rate').value) || 1,
    musicEnabled: groupVal('music') === 'true',
    musicQuality: groupVal('quality') || '320',
    avatarFit: groupVal('fit') || 'top',
    visionBase: $('#set-vision-base').value.trim(),
    visionKey: $('#set-vision-key').value.trim(),
    visionModel: $('#set-vision-model').value.trim(),
    gdStudioApi: $('#set-gd-api').value.trim() || DC.gdStudioApi,
    metingInstances: $('#set-meting').value.trim() || DC.metingInstances,
    themeColor1: $('#set-c1').value || DC.themeColor1,
    themeColor2: $('#set-c2').value || DC.themeColor2,
    systemPrompt: $('#set-prompt').value.trim() || DC.systemPrompt
  });
  if (avIn && avIn !== AV_LOCAL) CONFIG.avatarUrl = avIn;
  if (!CONFIG.avatarUrl) CONFIG.avatarUrl = DC.avatarUrl;
  if (CONFIG.avatarUrl.indexOf('data:') === 0) $('#set-avatar').value = AV_LOCAL;
  toolsBroken = false;
  $('#btn-music').hidden = !CONFIG.musicEnabled;
  if (!CONFIG.musicEnabled && M.audio) M.audio.pause();
  sSet('via_ai_config', CONFIG);

  // 记忆库的向量配置单独存（没开向量也不影响）
  const vEn = groupVal('memvec');
  if (vEn !== null && vEn !== undefined) MEMCFG.vecEnabled = vEn === 'true';
  if ($('#set-vec-base')) MEMCFG.vecBase = $('#set-vec-base').value.trim();
  if ($('#set-vec-key')) MEMCFG.vecKey = $('#set-vec-key').value.trim();
  if ($('#set-vec-model')) MEMCFG.vecModel = $('#set-vec-model').value.trim();
  memSaveCfg();

  history = [{ role: 'system', content: CONFIG.systemPrompt }]
    .concat(history.filter(m => m.role !== 'system'));
  sSet('via_ai_history', history);
  applyTheme();
  renderHistory();
  toast('已保存~');
  vibrate(20);
}
function exportData() {
  try {
    const c = Object.assign({}, CONFIG);
    delete c.apiKey;
    if (c.avatarUrl && c.avatarUrl.indexOf('data:') === 0) c.avatarUrl = '';
    const payload = { config: c, history, transCache, favorites, v: 1 };
    const code = b64e(JSON.stringify(payload));
    $('#backup-code').value = code;
    const ok = writeClipboard(code);
    toast(ok ? '已导出（不含 Key 与本地头像），已复制到剪贴板' : '已导出（不含 Key 与本地头像）');
  } catch (e) { toast('导出失败：' + errMsg(e)); }
}
function importData() {
  const raw = $('#backup-code').value.trim();
  if (!raw) return toast('请先粘贴备份代码');
  let d = null;
  try { d = JSON.parse(raw); }
  catch (e) {
    try { d = JSON.parse(b64d(raw)); }
    catch (e2) { return toast('导入失败：代码格式无效'); }
  }
  if (!d || typeof d !== 'object') return toast('导入失败：内容不是有效对象');
  try {
    if (d.config && typeof d.config === 'object') {
      const safe = {};
      for (const k in DC) if (k in d.config && typeof d.config[k] === typeof DC[k]) safe[k] = d.config[k];
      CONFIG = Object.assign(CONFIG, safe);
      if (!CONFIG.avatarUrl) CONFIG.avatarUrl = DC.avatarUrl;
      sSet('via_ai_config', CONFIG);
    }
    if (Array.isArray(d.history)) {
      history = d.history.filter(m => m && typeof m === 'object'
        && typeof m.role === 'string' && typeof m.content === 'string');
      if (!history.length) history = [{ role: 'system', content: CONFIG.systemPrompt }];
      sSet('via_ai_history', history);
    }
    if (d.transCache && typeof d.transCache === 'object' && !Array.isArray(d.transCache)) {
      const clean = {};
      for (const k in d.transCache) if (typeof d.transCache[k] === 'string') clean[k] = d.transCache[k];
      transCache = clean; sSet('via_ai_trans', transCache);
    }
    if (Array.isArray(d.favorites)) {
      favorites = d.favorites.filter(f => f && typeof f === 'object' && f.id && f.name);
      sSet('via_ai_favs', favorites);
    }
    toast('导入成功，正在重载…');
    setTimeout(() => location.reload(), 600);
  } catch (e) { toast('导入失败：' + errMsg(e)); }
}
async function clearAll() {
  if (!(await uiConfirm('将清空对话、记忆、收藏和所有设置，确定吗？', '清空'))) return;
  try { if (HAS_NATIVE && Android.clearAll) Android.clearAll(); } catch (e) {}
  try { localStorage.clear(); } catch (e) {}
  toast('已清除，正在重载…');
  setTimeout(() => location.reload(), 600);
}

function showView(v) {
  const bodyEl = $('#body'), footEl = $('#foot'), actionsEl = $('#actions');
  const settings = $('#settings'), music = $('#music'), mini = $('#mini-player'),
    memory = $('#memory'), memEdit = $('#mem-edit');
  const attachEl = $('#attach-bar');
  bodyEl.style.display = 'none';
  footEl.style.display = 'none';
  actionsEl.style.display = 'none';
  if (attachEl) attachEl.style.display = 'none';
  settings.classList.remove('open');
  music.classList.remove('open');
  if (memory) memory.classList.remove('open');
  if (memEdit) memEdit.classList.remove('open');
  mini.style.display = v === 'chat' ? '' : 'none';
  if (v === 'chat') {
    bodyEl.style.display = 'flex';
    footEl.style.display = 'flex';
    actionsEl.style.display = 'flex';
    if (attachEl) attachEl.style.display = '';
    bodyEl.scrollTop = bodyEl.scrollHeight;
    updateMini();
  } else if (v === 'settings') settings.classList.add('open');
  else if (v === 'music') music.classList.add('open');
  else if (v === 'memory' && memory) {
    memory.classList.add('open');
    const s = $('#mem-search');
    if (s) s.value = MEMUI.keyword;
    renderMemory();
  }
}

 *  音乐 UI
 * ========================================================== */
function bindMusicUI() {
  $$('.mtab').forEach(tab => {
    tab.onclick = () => {
      $$('.mtab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      M.currentTab = tab.dataset.tab;
      if (M.currentTab === 'fav') {
        $('#ms-wrap').style.display = 'none';
        M.playlist = favorites.slice();
        renderList(favorites);
      } else {
        $('#ms-wrap').style.display = 'flex';
        renderList(M.playlist);
      }
    };
  });
  $('#music-back').onclick = () => showView('chat');
  $('#fav-cnt').textContent = favorites.length;

  const doSearch = async () => {
    const kw = $('#ms-input').value.trim();
    if (!kw) return;
    $('#music-list').innerHTML = '<div class="mload">搜索中♪...</div>';
    try { renderList(await mSearch(kw)); }
    catch (e) { $('#music-list').innerHTML = `<div class="mempty">搜索失败：${esc(errMsg(e))}</div>`; }
  };
  $('#ms-btn').onclick = doSearch;
  $('#ms-input').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } };

  $('#music-player .mp-play').onclick = togglePlay;
  $('#music-player .mp-prev').onclick = playPrev;
  $('#music-player .mp-next').onclick = playNext;

  const progEl = $('#mp-progress');
  let progDrag = false;
  const seekTo = (clientX) => {
    if (!M.audio || !M.audio.duration || isNaN(M.audio.duration)) return;
    const r = progEl.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    M.audio.currentTime = p * M.audio.duration;
    updateProgress();
  };
  progEl.addEventListener('touchstart', e => { progDrag = true; seekTo(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  progEl.addEventListener('touchmove', e => { if (progDrag) { seekTo(e.touches[0].clientX); e.preventDefault(); } }, { passive: false });
  progEl.addEventListener('touchend', () => { progDrag = false; });
  progEl.addEventListener('mousedown', e => { progDrag = true; seekTo(e.clientX); e.preventDefault(); });
  document.addEventListener('mousemove', e => { if (progDrag) seekTo(e.clientX); });
  document.addEventListener('mouseup', () => { progDrag = false; });

  $('#music-lyric').onclick = () => { updateLyricModal(); $('#lyric-modal').classList.add('open'); };
  $('#lyric-modal').onclick = (e) => {
    if (e.target === $('#lyric-modal') || e.target.classList.contains('lyric-close')) {
      $('#lyric-modal').classList.remove('open');
    }
  };

  // 迷你播放器始终属于聊天布局；点标题才进入完整歌曲面板。
  const mini = $('#mini-player');
  mini.querySelector('.mini-play').onclick = () => { M.miniHidden = false; togglePlay(); };
  mini.querySelector('.mini-close').onclick = () => { M.miniHidden = true; mini.classList.remove('show'); };
  mini.querySelector('.mini-info').onclick = () => showView('music');
}

/* ==========================================================
 *  拖拽（Android 侧 WindowManager 移动）
 * ========================================================== */
function bindDrag() {
  const headEl = $('#head');
  let lastX = 0, lastY = 0, isDown = false;

  const start = (x, y) => {
    if (!HAS_PERM || !Perm.moveWindow) return;
    isDown = true; lastX = x; lastY = y;
  };
  const move = (x, y) => {
    if (!isDown) return;
    const dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    // screenX 是 css px，原生 moveBy 要物理 px
    const d = window.devicePixelRatio || 1;
    try { Perm.moveWindow(Math.round(dx * d), Math.round(dy * d)); } catch (e) {}
  };
  const end = () => { isDown = false; };

  headEl.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    const t = e.touches[0];
    start(t.screenX, t.screenY);
  }, { passive: true });
  headEl.addEventListener('touchmove', e => {
    if (!isDown) return;
    const t = e.touches[0];
    move(t.screenX, t.screenY);
    e.preventDefault();
  }, { passive: false });
  headEl.addEventListener('touchend', end);
  headEl.addEventListener('touchcancel', end);

  headEl.addEventListener('mousedown', e => {
    if (e.button !== 0 || e.target.closest('button')) return;
    start(e.screenX, e.screenY);
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => { if (isDown) move(e.screenX, e.screenY); });
  document.addEventListener('mouseup', end);
}

/* ==========================================================
 *  权限引导
 * ========================================================== */
const PERM_ITEMS = [
  { id: 'overlay', name: '悬浮窗权限', required: true,
    desc: '必需。没有它，爱莉希雅就只能缩在 App 里，没法浮在桌面上陪你。',
    check: () => (HAS_PERM && Perm.hasOverlay) ? Perm.hasOverlay() : false,
    request: () => { if (HAS_PERM && Perm.requestOverlay) Perm.requestOverlay(); },
    wait: 800 },
  { id: 'notification', name: '通知权限', required: true,
    desc: 'Android 13+ 需要它，浮窗才能稳定常驻，不被系统清掉。',
    check: () => (HAS_PERM && Perm.hasNotification) ? Perm.hasNotification() : true,
    request: () => { if (HAS_PERM && Perm.requestNotification) Perm.requestNotification(); },
    wait: 500 },
  { id: 'accessibility', name: '无障碍权限', required: false,
    desc: '可选但强烈推荐。开启后能读取屏幕内容，帮你翻译、总结当前页面。',
    check: () => (HAS_PERM && Perm.hasAccessibility) ? Perm.hasAccessibility() : false,
    request: () => { if (HAS_PERM && Perm.requestAccessibility) Perm.requestAccessibility(); },
    wait: 800 },
  { id: 'battery', name: '后台保活', required: false,
    desc: '可选。加入电池优化白名单，浮窗不会被系统杀掉。',
    check: () => (HAS_PERM && Perm.isIgnoringBattery) ? Perm.isIgnoringBattery() : false,
    request: () => { if (HAS_PERM && Perm.requestIgnoreBattery) Perm.requestIgnoreBattery(); },
    wait: 800 }
];
const permState = {};

function renderGuideSteps() {
  const box = $('#guide-steps');
  box.innerHTML = PERM_ITEMS.map(item => {
    const ok = !!permState[item.id];
    const cls = ok ? 'ok' : (item.required ? 'need' : '');
    const badge = ok ? '已完成' : (item.required ? '必需' : '推荐');
    const btn = ok
      ? `<button class="step-btn ghost" data-perm="${item.id}">重新授权</button>`
      : `<button class="step-btn" data-perm="${item.id}">去授权</button>`;
    const icon = ok ? '✓' : '!';
    return `<div class="step ${cls}" data-step="${item.id}">
      <div class="step-icon">${icon}</div>
      <div class="step-body">
        <div class="step-name">${esc(item.name)}<span class="step-badge">${badge}</span></div>
        <div class="step-desc">${esc(item.desc)}</div>
        ${btn}
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('.step-btn').forEach(b => {
    b.onclick = () => {
      const item = PERM_ITEMS.find(x => x.id === b.dataset.perm);
      if (!item) return;
      item.request();
      setTimeout(refreshPermState, item.wait);
      setTimeout(refreshPermState, 1500);
      vibrate(15);
    };
  });
  updateGuideNext();
}
function refreshPermState() {
  let changed = false;
  PERM_ITEMS.forEach(item => {
    let v = false;
    try { v = !!item.check(); } catch (e) { v = false; }
    if (permState[item.id] !== v) { permState[item.id] = v; changed = true; }
  });
  if (changed) renderGuideSteps();
}
function updateGuideNext() {
  const allRequiredOk = PERM_ITEMS.filter(i => i.required).every(i => permState[i.id]);
  const btn = $('#guide-next');
  btn.disabled = !allRequiredOk;
  btn.textContent = allRequiredOk ? '开始使用 ♪' : '还有必需权限未开启';
}
function showGuide() {
  $('#guide').classList.add('show');
  const av = $('#guide-avatar');
  av.src = CONFIG.avatarUrl || FALLBACK_AVATAR;
  av.onerror = function () { this.onerror = null; this.src = FALLBACK_AVATAR; };
  refreshPermState();
  renderGuideSteps();
}
function hideGuide() {
  $('#guide').classList.remove('show');
  if (HAS_PERM && Perm.setGuideDone) try { Perm.setGuideDone(); } catch (e) {}
}
function bindGuide() {
  $('#guide-next').onclick = () => {
    if ($('#guide-next').disabled) return;
    hideGuide();
    toast('准备完成，交给我吧~ ♪');
  };
  $('#guide-skip').onclick = () => {
    const missing = PERM_ITEMS.filter(i => i.required && !permState[i.id]);
    if (missing.length) {
      toast('还有必需权限没开哦\n' + missing.map(m => '· ' + m.name).join('\n'));
      return;
    }
    hideGuide();
  };
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshPermState();
  });
  setInterval(() => {
    if ($('#guide').classList.contains('show')) refreshPermState();
  }, 2000);

  let guideDone = false;
  if (HAS_PERM && Perm.isGuideDone) {
    try { guideDone = Perm.isGuideDone(); } catch (e) {}
  }
  setTimeout(() => {
    refreshPermState();
    const missing = PERM_ITEMS.filter(i => i.required && !permState[i.id]);
    if (!guideDone || missing.length) showGuide();
  }, 400);
}

if (document.readyState === 'loading') {

} else boot();
