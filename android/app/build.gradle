plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.elly.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.elly.assistant"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "0.6.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

dependencies {
    // 仅使用 Android framework，减少 APK 体积并避免额外 AAR 资源依赖。
}
