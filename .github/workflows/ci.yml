name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: 静态 / 行为 / 发布检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: index.html 与模块一致
        run: node tools/build-html.js --check

      - name: 运行期冒烟
        run: node tools/smoke.js

      - name: 行为测试
        run: node tools/behavior.test.js

      - name: 发布一致性
        run: node tools/check-release.js

      - name: 敏感信息扫描
        run: node tools/scan-secrets.js

  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 生成 index.html
        run: node tools/build-html.js

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
